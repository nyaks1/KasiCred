<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KasiCred — Build your trust. Bank your sales.</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #ffffff;
      }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    
    <script type="text/babel">
      const { useState, useEffect } = React;

      const API_URL = window.KASICRED_API_URL || "http://127.0.0.1:8000";

      const MOCK_FEED = [
        { stars: 5, amount: 45, time: "2m ago", hash: "0x8f2a1c" },
        { stars: 4, amount: 20, time: "1h ago", hash: "0x3c1e94" },
        { stars: 5, amount: 60, time: "3h ago", hash: "0xa71bd0" },
      ];

      function Stars({ n }) {
        return (
          <span style={{ letterSpacing: 1 }}>
            {"★".repeat(n)}
            <span style={{ opacity: 0.25 }}>{"★".repeat(5 - n)}</span>
          </span>
        );
      }

      function KasiCredApp() {
        const [view, setView] = useState("home"); // "home" | "signup" | "login" | "dashboard"
        const [form, setForm] = useState({ name: "", area: "", phone: "", sells: "", password: "" });
        const [submitting, setSubmitting] = useState(false);
        const [apiError, setApiError] = useState(null);
        
        // Dashboard state data
        const [metrics, setMetrics] = useState(null);
        const [reviews, setReviews] = useState(MOCK_FEED);
        const [loading, setLoading] = useState(false);

        const update = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

        // Fetch metrics when dashboard loads
        useEffect(() => {
          if (view !== "dashboard") return;
          const phone = (form.phone || "").trim().replace(/\s/g, "").toLowerCase();
          if (!phone) return;

          setLoading(true);
          setApiError(null);

          fetch(`${API_URL}/vendor/phone/${encodeURIComponent(phone)}`)
            .then((r) => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.json();
            })
            .then((data) => {
              setMetrics(data.trust_metrics);
              if (data.profile && data.profile.store_name) {
                setForm(f => ({ ...f, name: data.profile.store_name }));
              }
              setLoading(false);
            })
            .catch(() => {
              setApiError("Backend offline — showing demo metrics");
              setLoading(false);
            });
        }, [view, form.phone]);

        const handleRegister = (e) => {
          e.preventDefault();
          setSubmitting(true);
          setApiError(null);

          fetch(`${API_URL}/vendor/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              store_name: form.name,
              phone_number: form.phone,
              market_area: form.area,
              category_items: form.sells,
            }),
          })
            .then((res) => {
              if (!res.ok) throw new Error("Registration failed");
              return res.json();
            })
            .then(() => {
              setView("dashboard");
            })
            .catch(() => {
              setApiError("Backend offline — proceeding to local dashboard");
              setView("dashboard");
            })
            .finally(() => setSubmitting(false));
        };

        const handleLogin = (e) => {
          e.preventDefault();
          setView("dashboard");
        };

        const avgScore = metrics?.average_score || 4.6;
        const trustPct = Math.round((avgScore / 5) * 100);
        const reviewCount = metrics?.review_count || 128;
        const isLoanReady = trustPct >= 80;

        return (
          <div
            style={{
              fontFamily: "Inter, system-ui, sans-serif",
              background: "#0a0a0a",
              color: "#ffffff",
              minHeight: 460,
              width: "100%",
              maxWidth: 400,
              padding: "32px 24px",
              borderRadius: 12,
              border: "1px solid #222222",
              boxSizing: "border-box",
            }}
          >
            <style>{`
              @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
              .kc-display { font-family: 'Space Grotesk', sans-serif; }
              .kc-mono { font-family: 'IBM Plex Mono', monospace; }
              .kc-input {
                width: 100%; box-sizing: border-box; background: #000000; border: 1px solid #333333;
                color: #ffffff; padding: 12px 14px; border-radius: 6px; font-size: 14px; margin-top: 6px;
                outline: none; transition: border-color 0.15s;
              }
              .kc-input:focus { border-color: #ffffff; }
              .kc-label { font-size: 12px; color: #888888; margin-top: 14px; display: block; font-weight: 500; }
              .kc-btn {
                width: 100%; background: #ffffff; color: #000000; border: none; padding: 13px;
                border-radius: 6px; font-weight: 600; font-size: 14px; margin-top: 24px; cursor: pointer;
                transition: opacity 0.15s;
              }
              .kc-btn:hover { opacity: 0.85; }
              .kc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
              .kc-btn-outline {
                width: 100%; background: transparent; color: #ffffff; border: 1px solid #444444; padding: 13px;
                border-radius: 6px; font-weight: 600; font-size: 14px; margin-top: 12px; cursor: pointer;
                transition: border-color 0.15s;
              }
              .kc-btn-outline:hover { border-color: #ffffff; }
              .kc-error { background: #1a0000; border: 1px solid #550000; color: #ff9999; font-size: 12px;
                padding: 10px; border-radius: 6px; margin-top: 14px; }
            `}</style>

            {/* Header branding */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 24 }}>
              <div 
                className="kc-display" 
                style={{ fontSize: 24, fontWeight: 700, letterSpacing: -0.5, cursor: "pointer" }}
                onClick={() => setView("home")}
              >
                KasiCred
              </div>
              {view !== "home" && (
                <button 
                  style={{ background: "none", border: "none", color: "#888", cursor: "pointer", fontSize: "12px" }}
                  onClick={() => setView("home")}
                >
                  ← Home
                </button>
              )}
            </div>

            {apiError && <div className="kc-error">{apiError}</div>}

            {/* 1. HOME VIEW */}
            {view === "home" && (
              <div style={{ textAlign: "center", padding: "20px 0" }}>
                <div style={{ fontSize: 14, color: "#888", marginBottom: 8, lineHeight: 1.5 }}>
                  Build your trust. Bank your sales.
                </div>
                <div style={{ fontSize: 13, color: "#666", marginBottom: 36, lineHeight: 1.5 }}>
                  Decentralized ledger and trust tracking for informal street vendors.
                </div>

                <button className="kc-btn" onClick={() => setView("signup")}>
                  Create Ledger (Register)
                </button>
                <button className="kc-btn-outline" onClick={() => setView("login")}>
                  Log In
                </button>
              </div>
            )}

            {/* 2. SIGN UP VIEW */}
            {view === "signup" && (
              <form onSubmit={handleRegister}>
                <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>Register Vendor Ledger</div>
                
                <label className="kc-label">Vendor / stall name</label>
                <input className="kc-input" value={form.name} onChange={update("name")} placeholder="e.g. Mama Thandi's Kitchen" required />

                <label className="kc-label">Market or area</label>
                <input className="kc-input" value={form.area} onChange={update("area")} placeholder="e.g. Bree Street Market, Jozi" required />

                <label className="kc-label">Phone number</label>
                <input className="kc-input" value={form.phone} onChange={update("phone")} placeholder="071 234 5678" required />

                <label className="kc-label">What do you sell?</label>
                <input className="kc-input" value={form.sells} onChange={update("sells")} placeholder="e.g. Vetkoek, airtime, sweets" required />

                <label className="kc-label">Password</label>
                <input className="kc-input" type="password" value={form.password} onChange={update("password")} placeholder="••••••••" required />

                <button className="kc-btn" type="submit" disabled={submitting}>
                  {submitting ? "Creating..." : "Complete Registration"}
                </button>
              </form>
            )}

            {/* 3. LOGIN VIEW */}
            {view === "login" && (
              <form onSubmit={handleLogin}>
                <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>Vendor Login</div>

                <label className="kc-label">Phone number</label>
                <input className="kc-input" value={form.phone} onChange={update("phone")} placeholder="071 234 5678" required />

                <label className="kc-label">Password</label>
                <input className="kc-input" type="password" value={form.password} onChange={update("password")} placeholder="••••••••" required />

                <button className="kc-btn" type="submit">
                  Access Dashboard
                </button>
              </form>
            )}

            {/* 4. DASHBOARD VIEW */}
            {view === "dashboard" && (
              <div style={{ marginTop: 4 }}>
                <div style={{ fontSize: 13, color: "#888" }}>Dumela, {form.name || "Vendor"} 👋</div>

                {loading ? (
                  <div style={{ fontSize: 13, color: "#666", marginTop: 30, textAlign: "center" }}>Loading metrics...</div>
                ) : (
                  <>
                    <div
                      style={{
                        marginTop: 14,
                        background: "#111111",
                        border: "1px dashed #444444",
                        borderRadius: 6,
                        padding: "18px 16px",
                      }}
                    >
                      <div className="kc-mono" style={{ fontSize: 10, color: "#777", letterSpacing: 1 }}>
                        KASICRED TRUST RECEIPT
                      </div>
                      <div className="kc-display" style={{ fontSize: 34, fontWeight: 700, marginTop: 4 }}>
                        {trustPct}<span style={{ fontSize: 16, fontWeight: 400, color: "#888" }}> /100</span>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6 }}>
                        <span style={{ fontSize: 11.5, color: "#888" }}>Trust score</span>
                        <span
                          style={{
                            fontSize: 10,
                            fontWeight: 600,
                            color: "#000000",
                            background: isLoanReady ? "#ffffff" : "#aaaaaa",
                            padding: "2px 8px",
                            borderRadius: 999,
                          }}
                        >
                          {isLoanReady ? "LOAN READY" : "BUILDING"}
                        </span>
                      </div>

                      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 14, fontSize: 12.5 }}>
                        <span style={{ color: "#888" }}>Verified sales</span>
                        <span className="kc-mono">{reviewCount}</span>
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 12.5 }}>
                        <span style={{ color: "#888" }}>Avg rating</span>
                        <span className="kc-mono">{avgScore.toFixed(1)} ★</span>
                      </div>
                    </div>

                    <div style={{ fontSize: 12, color: "#888", marginTop: 22, marginBottom: 8, fontWeight: 600 }}>
                      Recent verified ratings
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {reviews.map((r, i) => (
                        <div
                          key={i}
                          style={{
                            display: "flex",
                            justifyContent: "space-between",
                            alignItems: "center",
                            background: "#111111",
                            border: "1px solid #222",
                            borderRadius: 6,
                            padding: "9px 12px",
                            fontSize: 12.5,
                          }}
                        >
                          <div>
                            <Stars n={r.stars} />
                          </div>
                          <div style={{ textAlign: "right" }}>
                            <div style={{ color: "#777", fontSize: 11 }}>{r.time}</div>
                            <div className="kc-mono" style={{ color: "#555", fontSize: 10 }}>{r.hash}</div>
                          </div>
                        </div>
                      ))}
                    </div>

                    <button className="kc-btn" style={{ background: "#ffffff", color: "#000000", marginTop: 20 }}>
                      Download proof-of-business PDF
                    </button>
                    
                    <button className="kc-btn-outline" onClick={() => setView("home")} style={{ marginTop: 10 }}>
                      Log Out
                    </button>
                  </>
                )}
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<KasiCredApp />);
    </script>
  </body>
</html>
