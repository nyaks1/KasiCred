<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KasiCred — Turn Daily Cash Trade into Portable, Tamper-Proof Trust</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111111;
        padding: 12px;
        box-sizing: border-box;
      }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="pdfGenerator.jsx"></script>
  </head>
  <body>
    <div id="root" style="width: 100%; display: flex; justify-content: center;"></div>
    
    <script type="text/babel">
      const { useState, useEffect } = React;

      const API_URL = window.KASICRED_API_URL || "https://kasicred-28bu.onrender.com";

      const MOCK_FEED = [
        { review_text: "Great fresh vetkoek every morning!", time: "2m ago", hash: "0x8f2a1c" },
        { review_text: "Friendly service and good prices.", time: "1h ago", hash: "0x3c1e94" },
      ];

      function KasiCredApp() {
        const [view, setView] = useState("login");
        // Store logged in vendor data separately from input form state
        const [vendor, setVendor] = useState({ name: "Jiara Martins", area: "Bree Street Market", sells: "Scones, sweets, vetkoek", phone: "" });
        const [form, setForm] = useState({ name: "", area: "", phone: "", sells: "", password: "" });
        const [submitting, setSubmitting] = useState(false);
        const [apiError, setApiError] = useState(null);
        
        const [metrics, setMetrics] = useState(null);
        const [reviews, setReviews] = useState(MOCK_FEED);
        const [loading, setLoading] = useState(false);

        const update = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

        useEffect(() => {
          if (view !== "dashboard") return;
          const phone = (form.phone || vendor.phone || "").trim().replace(/\s/g, "").toLowerCase();
          if (!phone) return;

          setLoading(true);
          setApiError(null);

          fetch(`${API_URL}/vendor/phone/${encodeURIComponent(phone)}`)
            .then((r) => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.json();
            })
            .then((data) => {
              if (data.profile) {
                setVendor({
                  name: data.profile.store_name || "Vendor Stall",
                  area: data.profile.market_area || "Local Market",
                  sells: data.profile.category_items || "General Goods",
                  phone: phone
                });
              }
              setMetrics(data.trust_metrics);
              if (data.recent_reviews && data.recent_reviews.length > 0) {
                setReviews(data.recent_reviews);
              }
              setLoading(false);
            })
            .catch(() => {
              // Keep current state if offline
              setLoading(false);
            });
        }, [view, form.phone]);

        const handleRegister = (e) => {
          e.preventDefault();
          setSubmitting(true);
          setApiError(null);

          fetch(`${API_URL}/vendor/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              store_name: form.name,
              phone_number: form.phone,
              market_area: form.area,
              category_items: form.sells,
              password: form.password
            }),
          })
            .then((res) => {
              if (!res.ok) throw new Error("Registration failed");
              return res.json();
            })
            .then((data) => {
              if (data.profile) {
                setVendor({
                  name: data.profile.store_name,
                  area: data.profile.market_area,
                  sells: data.profile.category_items,
                  phone: form.phone
                });
              } else {
                setVendor({ name: form.name, area: form.area, sells: form.sells, phone: form.phone });
              }
              setView("dashboard");
            })
            .catch(() => {
              // Fallback to form inputs if backend is offline
              setVendor({ name: form.name, area: form.area, sells: form.sells, phone: form.phone });
              setView("dashboard");
            })
            .finally(() => setSubmitting(false));
        };

        const handleLogin = (e) => {
          e.preventDefault();
          setSubmitting(true);
          setApiError(null);

          fetch(`${API_URL}/vendor/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              phone_number: form.phone,
              password: form.password
            }),
          })
            .then((res) => {
              if (!res.ok) throw new Error("Invalid credentials");
              return res.json();
            })
            .then((data) => {
              if (data.profile) {
                setVendor({
                  name: data.profile.store_name,
                  area: data.profile.market_area,
                  sells: data.profile.category_items,
                  phone: form.phone
                });
              }
              setView("dashboard");
            })
            .catch(() => {
              // Fallback for demo mode
              setVendor(f => ({ ...f, name: f.name || "Jiara Martins", area: "Bree Street Market", sells: "Scones, sweets, vetkoek", phone: form.phone }));
              setView("dashboard");
            })
            .finally(() => setSubmitting(false));
        };

        const avgScore = metrics?.average_score || 4.2;
        const trustPct = Math.round((avgScore / 5) * 100);
        const reviewCount = metrics?.review_count || 23;
        const isLoanReady = trustPct >= 70;
        const activeBlocks = Math.round((trustPct / 100) * 10);

        const generateShareableLink = (phone) => {
          fetch(`${API_URL}/api/report/create-link`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone_number: phone })
          })
          .then(res => res.json())
          .then(data => {
            const link = `https://kasicred-28bu.onrender.com/view-report.html?id=${data.report_id}`;
            prompt("Copy this shareable link for investors or buyers (R30 paywall active):", link);
          })
          .catch(() => {
            alert("Offline demo link: https://kasicred-28bu.onrender.com/view-report.html?id=demo_id");
          });
        };


        return (
          <div
            style={{
              fontFamily: "Inter, system-ui, sans-serif",
              backgroundColor: "#E6A15C",
              color: "#1A1A1A",
              width: "100%",
              maxWidth: "440px",
              minHeight: "min(92vh, 780px)",
              padding: "clamp(16px, 4vw, 28px)",
              borderRadius: "clamp(16px, 4vw, 28px)",
              boxShadow: "0 20px 40px rgba(0,0,0,0.5)",
              boxSizing: "border-box",
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              overflowY: "auto",
            }}
          >
            <style>{`
              @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
              .kc-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
              .kc-field-label { font-size: clamp(10px, 2.5vw, 11px); font-weight: 700; letter-spacing: 0.8px; color: #222222; margin-top: 12px; margin-bottom: 4px; display: block; text-transform: uppercase; }
              .kc-input-box {
                width: 100%; box-sizing: border-box; background: #F3C68F; border: 2px solid #5C3A19;
                color: #1A1A1A; padding: clamp(8px, 2vw, 12px) clamp(10px, 2.5vw, 14px); border-radius: 12px; font-size: clamp(13px, 3.5vw, 14px); font-weight: 500;
                outline: none; transition: all 0.2s;
              }
              .kc-input-box:focus { border-color: #000000; background: #FAE1C1; }
              .kc-btn-green {
                width: 100%; background: #00B654; color: #ffffff; border: 2px solid #000000; padding: clamp(12px, 3vw, 15px);
                border-radius: 14px; font-weight: 700; font-size: clamp(15px, 3.8vw, 17px); margin-top: 14px; cursor: pointer;
                box-shadow: 0 4px 0 #000000; transition: transform 0.1s, box-shadow 0.1s; text-transform: uppercase; letter-spacing: 0.5px;
              }
              .kc-btn-green:active { transform: translateY(2px); box-shadow: 0 2px 0 #000000; }
              .kc-btn-purple {
                width: 100%; background: #120099; color: #ffffff; border: 2px solid #000000; padding: clamp(10px, 2.5vw, 14px);
                border-radius: 14px; font-weight: 700; font-size: clamp(14px, 3.5vw, 16px); margin-top: 18px; cursor: pointer;
                box-shadow: 0 4px 0 #000000; transition: transform 0.1s, box-shadow 0.1s;
              }
              .kc-btn-white {
                width: 100%; background: #FFFFFF; color: #5C3A19; border: 2px solid #5C3A19; padding: clamp(12px, 3vw, 15px);
                border-radius: 14px; font-weight: 700; font-size: clamp(14px, 3.5vw, 16px); margin-top: 16px; cursor: pointer;
                box-shadow: 0 4px 0 #5C3A19; transition: transform 0.1s, box-shadow 0.1s;
              }
              .kc-btn-white:active { transform: translateY(2px); box-shadow: 0 2px 0 #5C3A19; }
              .kc-link { color: #1A1A1A; font-weight: 700; text-decoration: underline; cursor: pointer; }
              .kc-error { background: #5C2020; color: #FFD2D2; font-size: 11px; padding: 8px; border-radius: 8px; margin-top: 8px; width: 100%; text-align: center; }
            `}</style>

            {/* 1. LOGIN VIEW */}
            {view === "login" && (
              <div style={{ width: "100%", display: "flex", flexDirection: "column", alignItems: "center" }}>
                <div className="kc-title" style={{ fontSize: "clamp(20px, 6vw, 26px)", color: "#1A1A1A", marginBottom: 8 }}>
                  KASICRED
                </div>

                <div style={{ background: "#222222", padding: "6px", borderRadius: "20px", border: "3px solid #1A1A1A", marginBottom: 12, width: "clamp(80px, 24vw, 110px)", height: "clamp(80px, 24vw, 110px)", display: "flex", justifyContent: "center", alignItems: "center", boxSizing: "border-box" }}>
                  <img src="logo.png" alt="KasiCred Logo" style={{ width: "100%", height: "100%", objectFit: "contain", borderRadius: "14px" }} />
                </div>

                <div style={{ fontSize: "clamp(11px, 3vw, 13px)", textAlign: "center", fontWeight: 600, color: "#2A2A2A", marginBottom: 16, padding: "0 8px", lineHeight: 1.4 }}>
                  Turning Daily Cash Trade into Portable, Tamper-Proof Trust
                </div>

                {apiError && <div className="kc-error">{apiError}</div>}

                <form onSubmit={handleLogin} style={{ width: "100%" }}>
                  <label className="kc-field-label">Phone Number / Email</label>
                  <input className="kc-input-box" value={form.phone} onChange={update("phone")} placeholder="0712345678" required />

                  <label className="kc-field-label">Password</label>
                  <input className="kc-input-box" type="password" value={form.password} onChange={update("password")} placeholder="******" required />

                  <button className="kc-btn-green" type="submit" disabled={submitting}>
                    {submitting ? "Logging in..." : "Login"}
                  </button>
                </form>

                <div style={{ fontSize: "clamp(12px, 3vw, 13px)", marginTop: 16, color: "#222" }}>
                  Don’t have an account? <span className="kc-link" onClick={() => setView("signup")}>Register</span>
                </div>
              </div>
            )}

            {/* 2. SIGN UP VIEW */}
            {view === "signup" && (
              <div style={{ width: "100%", display: "flex", flexDirection: "column", alignItems: "center" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
                  <div style={{ background: "#222222", padding: "4px", borderRadius: "12px", border: "2px solid #1A1A1A", width: 40, height: 40, display: "flex", justifyContent: "center", alignItems: "center", boxSizing: "border-box" }}>
                    <img src="logo.png" alt="Logo" style={{ width: "100%", height: "100%", objectFit: "contain", borderRadius: "8px" }} />
                  </div>
                  <div className="kc-title" style={{ fontSize: "clamp(18px, 5vw, 22px)", color: "#1A1A1A" }}>
                    KASICRED
                  </div>
                </div>

                <div className="kc-title" style={{ fontSize: "clamp(20px, 5vw, 24px)", color: "#1A1A1A", marginTop: 2 }}>
                  Create Account
                </div>
                <div style={{ fontSize: "clamp(11px, 2.8vw, 12px)", color: "#333", marginBottom: 8, fontWeight: 500 }}>
                  Already Registered? <span className="kc-link" onClick={() => setView("login")}>Log in here.</span>
                </div>

                <form onSubmit={handleRegister} style={{ width: "100%" }}>
                  <label className="kc-field-label">Vendor/Stall Name</label>
                  <input className="kc-input-box" value={form.name} onChange={update("name")} placeholder="Jiara Martins" required />

                  <label className="kc-field-label">Market/Area</label>
                  <input className="kc-input-box" value={form.area} onChange={update("area")} placeholder="Bree Street Market" required />

                  <label className="kc-field-label">Phone Number</label>
                  <input className="kc-input-box" value={form.phone} onChange={update("phone")} placeholder="0712345678" required />

                  <label className="kc-field-label">What do you sell?</label>
                  <input className="kc-input-box" value={form.sells} onChange={update("sells")} placeholder="Scones, sweets, vetkoek" required />

                  <label className="kc-field-label">Password</label>
                  <input className="kc-input-box" type="password" value={form.password} onChange={update("password")} placeholder="******" required />

                  <button className="kc-btn-purple" type="submit" disabled={submitting}>
                    {submitting ? "Creating..." : "Sign up"}
                  </button>
                </form>
              </div>
            )}

            {/* 3. DASHBOARD VIEW */}
            {view === "dashboard" && (
              <div style={{ width: "100%", display: "flex", flexDirection: "column", alignItems: "center" }}>
                
                {/* Top Header with Logo and Back Button */}
                <div style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <div style={{ background: "#222222", padding: "3px", borderRadius: "10px", border: "2px solid #1A1A1A", width: 34, height: 34, display: "flex", justifyContent: "center", alignItems: "center" }}>
                      <img src="logo.png" alt="Logo" style={{ width: "100%", height: "100%", objectFit: "contain", borderRadius: "6px" }} />
                    </div>
                    <div className="kc-title" style={{ fontSize: "18px" }}>KASICRED</div>
                  </div>
                  <button onClick={() => setView("login")} style={{ background: "#F3C68F", border: "2px solid #5C3A19", padding: "5px 12px", borderRadius: "10px", fontWeight: 700, cursor: "pointer", fontSize: "11px", textTransform: "uppercase" }}>Back ◀</button>
                </div>

                <div style={{ fontSize: "13px", fontWeight: 700, color: "#222", marginBottom: 10, alignSelf: "flex-start" }}>
                  Dumela, {vendor.name} 👋
                </div>

                {loading ? (
                  <div style={{ textAlign: "center", padding: "40px 0", fontWeight: 600 }}>Loading dashboard...</div>
                ) : (
                  <>
                    {/* Dynamic User Info Card bound to active vendor state */}
                    <div style={{ width: "100%", background: "#F3C68F", border: "2px solid #5C3A19", borderRadius: "16px", padding: "12px 16px", textAlign: "center", marginBottom: 14, boxSizing: "border-box" }}>
                      <div style={{ fontSize: "16px", fontWeight: 700, color: "#1A1A1A" }}>{vendor.name}</div>
                      <div style={{ fontSize: "12px", fontWeight: 600, color: "#444", marginTop: 2 }}>{vendor.area}</div>
                      <div style={{ fontSize: "12px", fontWeight: 500, color: "#555", marginTop: 2, fontStyle: "italic" }}>{vendor.sells}</div>
                    </div>

                    {/* Ratings & Verified Reviews Row */}
                    <div style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, gap: 12 }}>
                      {/* Star Badge */}
                      <div style={{ flex: 1, background: "#F3C68F", border: "2px solid #5C3A19", borderRadius: "16px", padding: "12px", display: "flex", flexDirection: "column", alignItems: "center", position: "relative" }}>
                        <div style={{ fontSize: "36px", color: "#FFC700", filter: "drop-shadow(0 2px 2px rgba(0,0,0,0.2))", lineHeight: 1 }}>★</div>
                        <div className="kc-title" style={{ fontSize: "22px", marginTop: 4, color: "#1A1A1A" }}>{avgScore.toFixed(1)}</div>
                      </div>

                      {/* Verified Reviews Circle */}
                      <div style={{ flex: 1, background: "#F3C68F", border: "2px solid #5C3A19", borderRadius: "16px", padding: "12px", display: "flex", flexDirection: "column", alignItems: "center" }}>
                        <div style={{ fontSize: "10px", fontWeight: 700, textTransform: "uppercase", color: "#333", marginBottom: 4 }}>Verified Reviews</div>
                        <div style={{ width: "42px", height: "42px", borderRadius: "50%", background: "#0047FF", display: "flex", justifyContent: "center", alignItems: "center", color: "#fff", fontWeight: 700, fontSize: "16px", border: "2px solid #000" }}>
                          {reviewCount}
                        </div>
                      </div>
                    </div>

                    {/* Trust Percentage Progress Blocks */}
                    <div style={{ width: "100%", background: "#F3C68F", border: "2px solid #5C3A19", borderRadius: "16px", padding: "12px 14px", marginBottom: 14, boxSizing: "border-box" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                        <span style={{ fontSize: "11px", fontWeight: 700, textTransform: "uppercase", color: "#333" }}>Trust Percentage</span>
                        <span className="kc-title" style={{ fontSize: "16px", color: "#1A1A1A" }}>{trustPct}/100</span>
                      </div>

                      {/* 10 Block Grid */}
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(10, 1fr)", gap: "4px" }}>
                        {Array.from({ length: 10 }).map((_, idx) => (
                          <div
                            key={idx}
                            style={{
                              height: "18px",
                              borderRadius: "4px",
                              backgroundColor: idx < activeBlocks ? "#00B654" : "#D4B08C",
                              border: "1px solid #5C3A19"
                            }}
                          />
                        ))}
                      </div>
                    </div>

                    {/* Loan Ready Status Button */}
                    <div style={{ width: "100%", backgroundColor: "#00B654", border: "2px solid #000000", borderRadius: "14px", padding: "12px", textAlign: "center", color: "#fff", fontWeight: 700, fontSize: "15px", textTransform: "uppercase", letterSpacing: 0.5, boxShadow: "0 3px 0 #000", marginBottom: 16 }}>
                      {isLoanReady ? "Loan Ready" : "Building Trust"}
                    </div>

                    {/* Recent Customer Reviews Box */}
                    <div style={{ width: "100%", fontSize: "11px", fontWeight: 700, textTransform: "uppercase", marginBottom: 6, color: "#222", alignSelf: "flex-start" }}>
                      Recent customer reviews
                    </div>
                    <div style={{ width: "100%", background: "#F3C68F", border: "2px solid #5C3A19", borderRadius: "16px", padding: "12px", minHeight: "80px", maxHeight: "120px", overflowY: "auto", marginBottom: 16, boxSizing: "border-box" }}>
                      {reviews.length === 0 ? (
                        <div style={{ fontSize: "12px", color: "#555", fontStyle: "italic", textAlign: "center", marginTop: "15px" }}>No reviews yet.</div>
                      ) : (
                        reviews.map((r, i) => (
                          <div key={i} style={{ fontSize: "12px", borderBottom: i < reviews.length - 1 ? "1px solid #D4B08C" : "none", paddingBottom: "6px", marginBottom: "6px" }}>
                            <div style={{ fontWeight: 600, color: "#1A1A1A" }}>"{r.review_text || "Verified Sale Recorded"}"</div>
                            <div style={{ fontSize: "10px", color: "#555", marginTop: "2px" }}>{r.time} • <span style={{ fontFamily: "monospace" }}>{r.hash ? r.hash.slice(0, 8) : "on-chain"}</span></div>
                          </div>
                        ))
                      )}
                    </div>

                    {/* Download PDF Button */}
                    <div style={{ width: "100%", marginTop: "10px" }}>
                    <button className="kc-btn-white" onClick={() => generateShareableLink(vendor.phone)}>
                      Generate Shareable Report Link
                    </button>
                  </div>
                  </>
                )}
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<KasiCredApp />);
    </script>
  </body>
</html>
